<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@900&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  height:100vh; overflow:hidden;
  font-family:'Montserrat',sans-serif;
  background: linear-gradient(135deg,#ff2f92,#b517ff,#ff6ec7);
  background-size:400% 400%;
  animation:bg 10s infinite alternate;
}

@keyframes bg {
  from {background-position:0% 50%}
  to {background-position:100% 50%}
}

.center {
  position:relative;
  z-index:10;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}

h1 {
  font-size:clamp(2rem,7vw,3rem);
  color:#fff;
  text-shadow:0 0 20px #ffb3ff,0 0 40px #ff008c;
  animation:pulse 1.5s infinite;
}

@keyframes pulse {
  50% { transform:scale(1.06); }
}

.buttons {
  margin-top:30px;
  display:flex;
  gap:20px;
}

button {
  font-size:1.3rem;
  padding:16px 36px;
  border:none;
  border-radius:60px;
  cursor:pointer;
}

#yes {
  background:linear-gradient(45deg,#ff006e,#ff85c0);
  color:#fff;
  box-shadow:0 0 25px rgba(255,0,110,.9);
}

#no {
  background:#fff;
  color:#ff006e;
  position:relative;
}

.heart {
  position:fixed;
  bottom:-10vh;
  animation:float 7s linear infinite;
}

@keyframes float {
  to { transform:translateY(-120vh) rotate(360deg); }
}

canvas {
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:2;
}

#celebrate {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.15);
  display:none;
  z-index:20;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

#celebrate h2 {
  font-size:3rem;
  color:#fff;
  text-shadow:0 0 30px #fff;
  animation:bounce 1s infinite;
}

@keyframes bounce {
  50% { transform:translateY(-12px); }
}

.gifs {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:20px;
}

.gifs img {
  width:120px;
  border-radius:20px;
  box-shadow:0 0 20px rgba(255,255,255,.6);
}
</style>
</head>

<body>

<canvas id="fx"></canvas>

<div class="center" id="ask">
  <h1>PREETI, WILL YOU BE MY VALENTINE? 💘</h1>
  <div class="buttons">
    <button id="yes">YES 💖</button>
    <button id="no">NO 🙈</button>
  </div>
</div>

<div id="celebrate">
  <h2>I KNEW YOU LOVE ME 💕</h2>
  <div class="gifs">
    <img src="https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif">
    <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">
    <img src="https://media.giphy.com/media/3o6Zt481isNVuQI1l6/giphy.gif">
  </div>
</div>

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_6d9f88cfd4.mp3">
</audio>

<audio id="pop">
  <source src="https://cdn.pixabay.com/audio/2022/03/10/audio_8e1c6b1d8d.mp3">
</audio>

<script>
const no = document.getElementById('no');
const yes = document.getElementById('yes');
const ask = document.getElementById('ask');
const cel = document.getElementById('celebrate');
const music = document.getElementById('music');
const pop = document.getElementById('pop');

no.addEventListener('mouseenter', move);
no.addEventListener('touchstart', move);

function move(){
  no.style.position='fixed';
  no.style.left=Math.random()*(innerWidth-100)+'px';
  no.style.top=Math.random()*(innerHeight-60)+'px';
}

yes.onclick = ()=>{
  music.play().catch(()=>{});
  pop.play();
  ask.style.display='none';
  cel.style.display='flex';
  hearts();
  fireworks();
};

function hearts(){
  setInterval(()=>{
    const h=document.createElement('div');
    h.className='heart';
    h.textContent=['❤️','💖','💘','💞','💕'][Math.random()*5|0];
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=20+Math.random()*30+'px';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),7000);
  },120);
}

const canvas=document.getElementById('fx');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
resize();addEventListener('resize',resize);

let sparks=[];
function fireworks(){
  setInterval(()=>{
    for(let i=0;i<80;i++){
      sparks.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        vx:(Math.random()-.5)*6,
        vy:(Math.random()-.5)*6,
        life:60
      });
    }
  },600);
}

(function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  sparks.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.life--;
    ctx.fillStyle=`rgba(255,255,255,${p.life/60})`;
    ctx.fillRect(p.x,p.y,3,3);
  });
  sparks=sparks.filter(p=>p.life>0);
  requestAnimationFrame(animate);
})();
</script>

</body>
</html>
